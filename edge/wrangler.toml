# Edge-двойник API: Cloudflare Worker + D1. Один Worker отдаёт и SPA (статика
# из ../web/dist копируется в ./dist), и API (/api/v1/*) — один домен.
# Go-бэкенд в backend/ остаётся эталонной реализацией; этот Worker повторяет
# тот же HTTP-контракт на краю сети (edge twin).
name = "mindia-kz-edge"
main = "src/index.ts"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "mindia-kz"
database_id = "5bfee5ea-5819-45fc-9a5f-0b4b92efe1c1"

[assets]
directory = "./dist"
binding = "ASSETS"
# SPA: все пути, не попавшие в статику, отдают index.html (глубокие ссылки).
not_found_handling = "single-page-application"
# /api/* и /healthz всегда идут в Worker, остальная статика — напрямую из CDN.
run_worker_first = ["/api/*", "/healthz"]

[vars]
ENVIRONMENT = "production"
# LLM-ассистент: два OpenAI-compatible провайдера, ключи — секретами
# (wrangler secret put AI_API_KEY / AI_FALLBACK_API_KEY).
# Проверено диагностикой (ai/providers/*): у vyceai бесплатные модели отдают
# 400/503/403, поэтому рабочий endpoint — dahl; его модели в fallback-слоте
# (ключ dahl доступен только в слоте AI_FALLBACK_API_KEY).
# Порядок провайдеров: vyceai → dahl(GLM-5.3-Flash) → dahl(MiniMax M2.7).
AI_BASE_URL = "https://vyceai.com/v1"
AI_MODEL = "deepseek-v4.1"
AI_FALLBACK_BASE_URL = "https://inference.dahl.global/v1"
AI_FALLBACK_MODEL = "zai-org/GLM-5.3-Flash"
AI_FALLBACK_MODEL_ALT = "MiniMaxAI/MiniMax-M2.7"
# Таймаут одного вызова LLM: ответ после данных инструментов занимает 20-30 с,
# при 25 с вызов обрывался и пользователь получал офлайн-шаблон.
AI_TIMEOUT_MS = "60000"
AI_MAX_TOOL_CALLS = "6"
# Резервный оператор — Kilo Gateway (OpenAI-compatible, бесплатные модели).
# Включается, когда vyceai и dahl недоступны или упираются в лимит запросов.
# Ключ — секретом: npx --yes wrangler@4 secret put AI_RESERVE_API_KEY
AI_RESERVE_BASE_URL = "https://api.kilo.ai/api/gateway"
AI_RESERVE_MODEL = "nvidia/nemotron-3.5-lightning:free"
AI_RESERVE_MODEL_ALT = "kilo-auto/free"

# JWT_SECRET задаётся секретом: npx --yes wrangler@4 secret put JWT_SECRET
